# Bank Nifty Opportunity Radar - configuration
# Edit values here; no code changes needed.

start_date: "2015-01-01"        # ~10+ years of history
cache_dir: "data/cache"
output_dir: "output"
model_dir: "models"

# Yahoo Finance symbols (free daily data)
tickers:
  banknifty: "^NSEBANK"
  nifty: "^NSEI"
  india_vix: "^INDIAVIX"
  sp500: "^GSPC"
  nasdaq: "^IXIC"
  us_vix: "^VIX"
  us10y: "^TNX"
  dxy: "DX-Y.NYB"
  brent: "BZ=F"
  usdinr: "INR=X"
  gold: "GC=F"
  nikkei: "^N225"
  hangseng: "^HSI"

# What counts as a "big move" day for Bank Nifty
labels:
  big_move_quantile: 0.80     # day's high-low range in top 20% of the past year = big move
  lookback_days: 250          # rolling window for that threshold (uses only past data)

# Walk-forward model settings
model:
  first_test_year: 2019       # train on everything before a year, test on that year, repeat
  min_train_years: 3
  flag_rate: 0.25             # flag the top 25% most likely days as "opportunity"
  params:                     # scikit-learn HistGradientBoostingClassifier
    max_iter: 300
    learning_rate: 0.04
    max_leaf_nodes: 15
    min_samples_leaf: 40
    l2_regularization: 1.0
    random_state: 0

# Option-buying proxy backtest (see README: this is a proxy, not real option P&L)
backtest:
  straddle_factor: 0.8        # expected |move| of a normal distribution = 0.8 x daily sigma
  cost_frac_of_implied: 0.15  # costs + slippage as a fraction of the implied daily move

# Expiry calendars (approximate; holidays handled by moving to previous trading day)
# weekday: MON TUE WED THU FRI, or null = no expiry in that era
expiry_rules:
  monthly:
    - {from: "2015-01-01", weekday: "THU"}
    - {from: "2025-09-01", weekday: "TUE"}
  weekly:
    - {from: "2015-01-01", weekday: null}
    - {from: "2016-05-27", weekday: "THU"}
    - {from: "2023-09-04", weekday: "WED"}
    - {from: "2024-11-14", weekday: null}

# Union Budget days (big scheduled volatility events)
budget_days:
  - "2015-02-28"
  - "2016-02-29"
  - "2017-02-01"
  - "2018-02-01"
  - "2019-02-01"
  - "2019-07-05"
  - "2020-02-01"
  - "2021-02-01"
  - "2022-02-01"
  - "2023-02-01"
  - "2024-02-01"
  - "2024-07-23"
  - "2025-02-01"
  - "2026-02-01"

# Optional: your own event list (RBI policy, FOMC, elections...). CSV columns: date,event
# Each distinct event name becomes a feature (is_<event>). Leave blank if none.
events_csv: "data/events.csv"

news:
  # GDELT DOC API: free daily news tone + volume since 2017
  use_gdelt: true
  gdelt_queries:
    rbi: '"Reserve Bank of India"'
    indian_banks: '("HDFC Bank" OR "ICICI Bank" OR "State Bank of India" OR "Axis Bank" OR "Kotak Mahindra")'
    india_market: '(Sensex OR Nifty) sourcecountry:IN'
    india_inflation: '(inflation OR "repo rate") sourcecountry:IN'
    fed: '"Federal Reserve"'
    geo_risk: '(war OR missile OR "terror attack") sourcecountry:IN'
  gdelt_sleep_sec: 6          # GDELT asks for at least 5 s between requests
  gdelt_timeout_sec: 30
  gdelt_backoff_sec: 30       # wait after a 'too many requests' reply before one retry
  train_fetch_budget_min: 0   # minutes training may spend downloading news (0 = use saved news only)
  # Optional headlines file (e.g. India News Headlines dataset from Kaggle)
  # columns: publish_date (YYYYMMDD), headline_category, headline_text
  headlines_csv: "data/india-news-headlines.csv"
  sentiment_backend: "auto"   # auto | finbert | lexicon

# Daily auto-forecast while the app is open (local time, Mon-Fri)
schedule:
  enabled: true
  time: "18:30"
  weekly_retrain: true        # retrain every Saturday at the same time

# Optional Telegram alert for predict_today.py
telegram:
  bot_token: ""
  chat_id: ""

# Live scanner (Upstox real-time data). Most of these can be changed in the app's Settings.
live:
  source: "upstox"             # upstox | sim (built-in market simulator for testing)
  upstox_api_key: ""
  upstox_api_secret: ""
  redirect_uri: "http://127.0.0.1:8765/upstox/callback"
  auto_start: true             # start at 9:00 on market days when logged in
  sim_speed: 10                # simulator: 10 = a full trading day in ~38 minutes
  option_budget: 1900          # options streamed live (Upstox limit is 2000 with greeks)
  index_strikes: 12            # strikes each side of ATM for indices
  top_stock_strikes: 3         # strikes each side of ATM for the most liquid stocks (others: ATM only)
  cooldown_min: 15             # same alert for the same stock at most once in this many minutes
  telegram_min_severity: 3     # 1 = everything, 2 = important, 3 = only the biggest
  news: true
  detectors: {}                # override thresholds, see live/detectors.py DEFAULTS
  filings: true                # live NSE company filings (results, orders, M&A...)
  briefs: true                 # pre-market brief 8:45, post-market review at close
  mute_hit_rate: 45            # alert types that work less than this % of decided cases (20+) are demoted
  focus_min_severity: 3        # Focus feed: act-now alerts only (demoted ones drop out)
  focus_gap_min: 60            # Focus feed: at most one alert per symbol per this many minutes
  telegram_focus_only: true    # Telegram gets Focus alerts only
  keep_recordings_days: 365
  paper:
    auto: true
    lots: 1
    target_pct: 30
    stop_pct: 20
    capital: 500000            # risk guard: lots sized so a stop loses ~risk_pct of capital
    risk_pct: 1.0
    max_daily_loss_pct: 3.0
    max_trades_day: 12

# AI explanations and market pulse (optional). provider: gemini (free tier) or claude
ai:
  provider: "gemini"
  api_key: ""
  model: ""
  pulse_every_min: 15
  explain_min_severity: 3
  daily_limit: 200
  brain_every_min: 10          # AI market brain note interval (rules-only notes every 5 min without a key)
  brain_telegram: 0            # 1 = also send AI brain notes to Telegram

# Strategy lab: backtests on Dhan historical option data, and the live strategy desk (paper)
lab:
  dhan_client_id: ""
  dhan_token: ""
  years: 3                     # history to download
  capital: 500000              # sizing for backtest and the live desk
  risk_pct: 1.5                # planned loss of one trade (stops hit + 50% buffer), % of capital
  alloc_pct: 25                # max margin one strategy may use, % of capital
  daily_stop_pct: 2.0          # close everything for the day after losing this % of capital
  auto_trade: true             # paper-trade today's plan automatically
