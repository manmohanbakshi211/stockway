<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Nifty Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%233D2FA8' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%233D2FA8'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#/tomorrow">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" /><circle cx="16" cy="16" r="7" /><circle cx="16" cy="16" r="2.5" class="dot"/><path d="M16 16 L27 9" /></svg>
      <span><b>Radar</b><small>Bank Nifty</small></span>
    </a>
    <ul>
      <li><a href="#/tomorrow" data-page="tomorrow">Tomorrow</a></li>
      <li><a href="#/history" data-page="history">History</a></li>
      <li><a href="#/biggest" data-page="biggest">Biggest days</a></li>
      <li><a href="#/drivers" data-page="drivers">What drives moves</a></li>
      <li><a href="#/check" data-page="check">Model check</a></li>
      <li><a href="#/data" data-page="data">Data &amp; settings</a></li>
    </ul>
    <div class="rail-foot" id="rail-status"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <button class="icon-btn drawer-close" data-close aria-label="Close">✕</button>
    <div id="drawer-body"></div>
  </div>
</aside>

<section class="job" id="job" hidden aria-live="polite">
  <div class="job-head">
    <div><b id="job-label"></b><span id="job-step"></span></div>
    <span class="job-actions"><button class="link-btn" id="job-stop">Stop</button><button class="link-btn" id="job-toggle" aria-expanded="false">Show log</button></span>
  </div>
  <div class="job-bar"><i id="job-progress"></i></div>
  <pre class="job-log" id="job-log" hidden></pre>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="/static/vendor/plotly.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
